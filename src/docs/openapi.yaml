openapi: 3.0.0
info:
    title: Chat Bot API
    version: 1.0.0
    description: Backend API cho hệ thống chat bot tương tự ChatGPT
    contact:
        name: thanh090800@gmail.com

servers:
    - url: http://127.0.0.1:3000/api
      description: Local development
    - url: https://your-app.railway.app
      description: Production

components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: JWT access token

    schemas:
        User:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                    example: "1"
                email:
                    type: string
                    format: email
                    example: user@gmail.com
                name:
                    type: string
                    nullable: true
                    example: "Nguyen Van A"
                emailVerifiedAt:
                    type: string
                    format: date-time
                    nullable: true
                activeConversationId:
                    type: string
                    format: int64
                    nullable: true
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time

        Conversation:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                    example: "1"
                title:
                    type: string
                    nullable: true
                    example: "Chat về AI"
                systemPrompt:
                    type: string
                    nullable: true
                    description: System prompt cho bot conversation
                    example: "You are a helpful AI assistant"
                type:
                    type: string
                    enum: [DIRECT, GROUP, BOT]
                    example: DIRECT
                ownerId:
                    type: string
                    format: int64
                    nullable: true
                    description: ID của owner (dùng với chat bot)
                lastMessageAt:
                    type: string
                    format: date-time
                    nullable: true
                deletedAt:
                    type: string
                    format: date-time
                    nullable: true
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time

        ConversationWithParticipants:
            allOf:
                - $ref: "#/components/schemas/Conversation"
                - type: object
                  properties:
                      participants:
                          type: array
                          items:
                              $ref: "#/components/schemas/ConversationParticipant"
                      unreadCount:
                          type: integer
                          example: 5

        ConversationParticipant:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                    example: "1"
                conversationId:
                    type: string
                    format: int64
                userId:
                    type: string
                    format: int64
                role:
                    type: string
                    enum: [MEMBER, OWNER, BOT]
                    example: MEMBER
                joinedAt:
                    type: string
                    format: date-time
                leftAt:
                    type: string
                    format: date-time
                    nullable: true
                lastReadAt:
                    type: string
                    format: date-time
                    nullable: true
                deletedAt:
                    type: string
                    format: date-time
                    nullable: true
                user:
                    $ref: "#/components/schemas/User"

        Message:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                    example: "1"
                conversationId:
                    type: string
                    format: int64
                parentMessageId:
                    type: string
                    format: int64
                    nullable: true
                userId:
                    type: string
                    format: int64
                    nullable: true
                role:
                    type: string
                    enum: [user, bot]
                    example: user
                content:
                    type: string
                    example: "Xin chào, tôi cần giúp đỡ về AI"
                isEdited:
                    type: boolean
                    default: false
                deletedAt:
                    type: string
                    format: date-time
                    nullable: true
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                user:
                    $ref: "#/components/schemas/User"
                    nullable: true
                attachments:
                    type: array
                    items:
                        $ref: "#/components/schemas/MessageAttachment"

        MessageAttachment:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                messageId:
                    type: string
                    format: int64
                fileName:
                    type: string
                    example: "document.pdf"
                fileUrl:
                    type: string
                    example: "https://storage.example.com/files/abc123.pdf"
                fileType:
                    type: string
                    example: "application/pdf"
                fileSize:
                    type: integer
                    example: 1048576
                createdAt:
                    type: string
                    format: date-time

        AuthResponse:
            type: object
            properties:
                accessToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                refreshToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                user:
                    $ref: "#/components/schemas/User"

        Error:
            type: object
            properties:
                error:
                    type: string
                    example: Invalid credentials
                message:
                    type: string
                    example: Email hoặc password không đúng
                statusCode:
                    type: integer
                    example: 401

    responses:
        Unauthorized:
            description: Unauthorized - Token không hợp lệ hoặc hết hạn
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
                    example:
                        error: Unauthorized
                        message: Token không hợp lệ
                        statusCode: 401

        BadRequest:
            description: Bad Request - Dữ liệu đầu vào không hợp lệ
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
                    example:
                        error: Bad Request
                        message: Email không đúng định dạng
                        statusCode: 400

        NotFound:
            description: Not Found - Resource không tồn tại
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
                    example:
                        error: Not Found
                        message: Conversation không tồn tại
                        statusCode: 404

        TooManyRequests:
            description: Too Many Requests - Rate limit exceeded
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
                    example:
                        error: Too Many Requests
                        message: Bạn đã gửi quá nhiều request, vui lòng thử lại sau
                        statusCode: 429

        InternalServerError:
            description: Internal Server Error
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
                    example:
                        error: Internal Server Error
                        message: Đã có lỗi xảy ra, vui lòng thử lại
                        statusCode: 500

paths:
    /auth/register:
        post:
            tags: [Auth]
            summary: Đăng ký tài khoản mới
            description: Tạo tài khoản người dùng mới
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [email, password]
                            properties:
                                email:
                                    type: string
                                    format: email
                                    example: user@gmail.com
                                password:
                                    type: string
                                    minLength: 6
                                    example: "123456"
                                name:
                                    type: string
                                    example: "Nguyen Van A"
            responses:
                201:
                    description: Đăng ký thành công
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AuthResponse"
                400:
                    $ref: "#/components/responses/BadRequest"
                500:
                    $ref: "#/components/responses/InternalServerError"

    /auth/login:
        post:
            tags: [Auth]
            summary: Đăng nhập
            description: Đăng nhập và nhận access token + refresh token
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [email, password]
                            properties:
                                email:
                                    type: string
                                    format: email
                                    example: user@gmail.com
                                password:
                                    type: string
                                    example: "123456"
            responses:
                200:
                    description: Đăng nhập thành công
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AuthResponse"
                400:
                    $ref: "#/components/responses/BadRequest"
                401:
                    description: Unauthorized
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                            example:
                                error: Invalid credentials
                                message: Email hoặc password không đúng
                                statusCode: 401
                500:
                    $ref: "#/components/responses/InternalServerError"

    /auth/refresh:
        post:
            tags: [Auth]
            summary: Refresh access token
            description: Lấy access token mới bằng refresh token
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [refreshToken]
                            properties:
                                refreshToken:
                                    type: string
                                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            responses:
                200:
                    description: Token mới
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    accessToken:
                                        type: string
                                    refreshToken:
                                        type: string
                401:
                    $ref: "#/components/responses/Unauthorized"
                500:
                    $ref: "#/components/responses/InternalServerError"

    /auth/logout:
        post:
            tags: [Auth]
            summary: Đăng xuất
            description: Đăng xuất và vô hiệu hóa token
            security:
                - bearerAuth: []
            responses:
                200:
                    description: Đăng xuất thành công
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        type: string
                                        example: Logout thành công
                401:
                    $ref: "#/components/responses/Unauthorized"
                500:
                    $ref: "#/components/responses/InternalServerError"

    /auth/me:
        get:
            tags: [Auth]
            summary: Lấy thông tin user hiện tại
            description: Lấy thông tin user từ access token
            security:
                - bearerAuth: []
            responses:
                200:
                    description: Thông tin user
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/User"
                401:
                    $ref: "#/components/responses/Unauthorized"
                500:
                    $ref: "#/components/responses/InternalServerError"

    /conversation/direct:
        post:
            tags: [Conversation]
            summary: Tạo cuộc hội thoại trực tiếp (DIRECT)
            description: |
                Tạo một cuộc hội thoại trực tiếp 1-1 giữa user hiện tại và user khác.
                Type: DIRECT
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [participantId]
                            properties:
                                participantId:
                                    type: string
                                    format: int64
                                    description: ID của user để chat
                                    example: "2"
                                title:
                                    type: string
                                    description: Tiêu đề (tùy chọn)
                                    example: "Chat với John"
            responses:
                201:
                    description: Tạo conversation thành công
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ConversationWithParticipants"
                400:
                    $ref: "#/components/responses/BadRequest"
                401:
                    $ref: "#/components/responses/Unauthorized"
                429:
                    $ref: "#/components/responses/TooManyRequests"
                500:
                    $ref: "#/components/responses/InternalServerError"

    /conversation/bot:
        post:
            tags: [Bot Conversations]
            summary: Tạo cuộc hội thoại với bot (BOT)
            description: |
                Tạo một cuộc hội thoại mới với AI bot.
                Type: BOT
                Owner: User hiện tại
            security:
                - bearerAuth: []
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                title:
                                    type: string
                                    description: Tiêu đề cuộc hội thoại
                                    example: "Chat với AI Assistant"
                                systemPrompt:
                                    type: string
                                    description: System prompt tùy chỉnh cho bot
                                    example: "You are a helpful coding assistant"
            responses:
                201:
                    description: Tạo bot conversation thành công
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Conversation"
                400:
                    $ref: "#/components/responses/BadRequest"
                401:
                    $ref: "#/components/responses/Unauthorized"
                500:
                    $ref: "#/components/responses/InternalServerError"

    /conversation:
        get:
            tags: [Conversation]
            summary: Lấy tất cả conversations
            description: |
                Lấy danh sách tất cả conversations của user (DIRECT, GROUP, BOT).
                Bao gồm thông tin participants và unread count.
            security:
                - bearerAuth: []
            parameters:
                - name: page
                  in: query
                  schema:
                      type: integer
                      default: 1
                  description: Số trang
                - name: limit
                  in: query
                  schema:
                      type: integer
                      default: 20
                  description: Số lượng items mỗi trang
                - name: type
                  in: query
                  schema:
                      type: string
                      enum: [DIRECT, GROUP, BOT]
                  description: Lọc theo loại conversation
            responses:
                200:
                    description: Danh sách conversations
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    conversations:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/ConversationWithParticipants"
                                    total:
                                        type: integer
                                        example: 50
                                    page:
                                        type: integer
                                        example: 1
                                    limit:
                                        type: integer
                                        example: 20
                                    totalPages:
                                        type: integer
                                        example: 3
                401:
                    $ref: "#/components/responses/Unauthorized"
                429:
                    $ref: "#/components/responses/TooManyRequests"
                500:
                    $ref: "#/components/responses/InternalServerError"

    /conversation/bots:
        get:
            tags: [Bot Conversations]
            summary: Lấy danh sách bot conversations
            description: Lấy tất cả conversations có type = BOT của user hiện tại
            security:
                - bearerAuth: []
            parameters:
                - name: page
                  in: query
                  schema:
                      type: integer
                      default: 1
                - name: limit
                  in: query
                  schema:
                      type: integer
                      default: 20
            responses:
                200:
                    description: Danh sách bot conversations
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    conversations:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/Conversation"
                                    total:
                                        type: integer
                                    page:
                                        type: integer
                                    limit:
                                        type: integer
                                    totalPages:
                                        type: integer
                401:
                    $ref: "#/components/responses/Unauthorized"
                429:
                    $ref: "#/components/responses/TooManyRequests"
                500:
                    $ref: "#/components/responses/InternalServerError"

    /conversation/bots/{conversationId}:
        get:
            tags: [Bot Conversations]
            summary: Lấy chi tiết bot conversation
            description: Lấy thông tin chi tiết của một bot conversation
            security:
                - bearerAuth: []
            parameters:
                - name: conversationId
                  in: path
                  required: true
                  schema:
                      type: string
                      format: int64
                  example: "1"
            responses:
                200:
                    description: Thông tin bot conversation
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Conversation"
                401:
                    $ref: "#/components/responses/Unauthorized"
                404:
                    $ref: "#/components/responses/NotFound"
                429:
                    $ref: "#/components/responses/TooManyRequests"
                500:
                    $ref: "#/components/responses/InternalServerError"
    /conversation/{conversationId}:
        get:
            tags: [Conversation]
            summary: Lấy chi tiết conversation
            description: Lấy thông tin chi tiết của một conversation bao gồm participants
            security:
                - bearerAuth: []
            parameters:
                - name: conversationId
                  in: path
                  required: true
                  schema:
                      type: string
                      format: int64
                  example: "1"
            responses:
                200:
                    description: Thông tin conversation
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ConversationWithParticipants"
                401:
                    $ref: "#/components/responses/Unauthorized"
                404:
                    $ref: "#/components/responses/NotFound"
                429:
                    $ref: "#/components/responses/TooManyRequests"
                500:
                    $ref: "#/components/responses/InternalServerError"

        put:
            tags: [Conversation]
            summary: Cập nhật conversation
            description: Đổi tên hoặc cập nhật system prompt của conversation
            security:
                - bearerAuth: []
            parameters:
                - name: conversationId
                  in: path
                  required: true
                  schema:
                      type: string
                      format: int64
                  example: "1"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                title:
                                    type: string
                                    description: Tên mới cho conversation
                                    example: "Chat về Deep Learning"
                                systemPrompt:
                                    type: string
                                    description: System prompt mới (chỉ cho BOT conversation)
                                    example: "You are an expert in deep learning"
            responses:
                200:
                    description: Cập nhật thành công
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Conversation"
                400:
                    $ref: "#/components/responses/BadRequest"
                401:
                    $ref: "#/components/responses/Unauthorized"
                404:
                    $ref: "#/components/responses/NotFound"
                429:
                    $ref: "#/components/responses/TooManyRequests"
                500:
                    $ref: "#/components/responses/InternalServerError"

        delete:
            tags: [Conversation]
            summary: Xóa conversation (soft delete)
            description: Soft delete conversation (set deletedAt)
            security:
                - bearerAuth: []
            parameters:
                - name: conversationId
                  in: path
                  required: true
                  schema:
                      type: string
                      format: int64
                  example: "1"
            responses:
                200:
                    description: Xóa thành công
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        type: string
                                        example: Conversation đã được xóa
                401:
                    $ref: "#/components/responses/Unauthorized"
                404:
                    $ref: "#/components/responses/NotFound"
                429:
                    $ref: "#/components/responses/TooManyRequests"
                500:
                    $ref: "#/components/responses/InternalServerError"

    /conversation/{conversationId}/stream:
        get:
            tags: [Message]
            summary: Stream AI response (SSE)
            description: |
                Server-Sent Events endpoint để stream AI response real-time.
                Chỉ hoạt động với BOT conversations.

                **Cách sử dụng:**
                1. Tạo EventSource với Authorization header
                2. Listen event 'message'
                3. Parse JSON từ event.data
                4. Khi nhận [DONE], đóng connection

                **Event format:**
                data: {"content": "text chunk"}
                data: [DONE]
            security:
                - bearerAuth: []
            parameters:
                - name: conversationId
                  in: path
                  required: true
                  schema:
                      type: string
                      format: int64
                  example: "1"
                - name: message
                  in: query
                  required: true
                  description: User message content
                  schema:
                      type: string
                  example: "Giải thích về machine learning"
            responses:
                200:
                    description: Event stream
                    content:
                        text/event-stream:
                            schema:
                                type: string
                            example: |
                                data: {"content": "Machine learning"}

                                data: {"content": " là"}

                                data: {"content": " một nhánh"}

                                data: [DONE]
                400:
                    $ref: "#/components/responses/BadRequest"
                401:
                    $ref: "#/components/responses/Unauthorized"
                404:
                    $ref: "#/components/responses/NotFound"
                429:
                    $ref: "#/components/responses/TooManyRequests"
                500:
                    $ref: "#/components/responses/InternalServerError"

    /messages/conversation/{conversationId}:
        get:
            tags: [Message]
            summary: Lấy messages trong conversation
            description: Lấy danh sách messages với pagination, bao gồm attachments và user info
            security:
                - bearerAuth: []
            parameters:
                - name: conversationId
                  in: path
                  required: true
                  schema:
                      type: string
                      format: int64
                  example: "1"
                - name: page
                  in: query
                  schema:
                      type: integer
                      default: 1
                - name: limit
                  in: query
                  schema:
                      type: integer
                      default: 50
                - name: before
                  in: query
                  description: Lấy messages trước message ID này (cursor pagination)
                  schema:
                      type: string
                      format: int64
            responses:
                200:
                    description: Danh sách messages
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    messages:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/Message"
                                    total:
                                        type: integer
                                    page:
                                        type: integer
                                    limit:
                                        type: integer
                                    hasMore:
                                        type: boolean
                401:
                    $ref: "#/components/responses/Unauthorized"
                404:
                    $ref: "#/components/responses/NotFound"
                500:
                    $ref: "#/components/responses/InternalServerError"

    /message/conversation/{conversationId}:
        post:
            tags: [Message]
            summary: Gửi message mới
            description: |
                Gửi message và nhận response từ AI (không streaming).
                Tự động tạo message với role 'user' và AI response với role 'bot'.
                Cập nhật lastMessageAt và lastReadAt.
            security:
                - bearerAuth: []
            parameters:
                - name: conversationId
                  in: path
                  required: true
                  schema:
                      type: string
                      format: int64
                  example: "1"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [content]
                            properties:
                                content:
                                    type: string
                                    example: "Giải thích về AI cho tôi"
                                parentMessageId:
                                    type: string
                                    format: int64
                                    description: ID của message cha (để reply)
                                    nullable: true
            responses:
                200:
                    description: Message đã tạo và AI response
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    userMessage:
                                        $ref: "#/components/schemas/Message"
                                    aiMessage:
                                        $ref: "#/components/schemas/Message"
                400:
                    $ref: "#/components/responses/BadRequest"
                401:
                    $ref: "#/components/responses/Unauthorized"
                404:
                    $ref: "#/components/responses/NotFound"
                429:
                    $ref: "#/components/responses/TooManyRequests"
                500:
                    $ref: "#/components/responses/InternalServerError"

        put:
            tags: [Message]
            summary: Sửa message
            description: Chỉnh sửa nội dung message (set isEdited = true)
            security:
                - bearerAuth: []
            parameters:
                - name: conversationId
                  in: path
                  required: true
                  schema:
                      type: string
                      format: int64
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [messageId, content]
                            properties:
                                messageId:
                                    type: string
                                    format: int64
                                    example: "10"
                                content:
                                    type: string
                                    example: "Nội dung đã chỉnh sửa"
            responses:
                200:
                    description: Message đã sửa
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Message"
                400:
                    $ref: "#/components/responses/BadRequest"
                401:
                    $ref: "#/components/responses/Unauthorized"
                404:
                    $ref: "#/components/responses/NotFound"
                500:
                    $ref: "#/components/responses/InternalServerError"

        delete:
            tags: [Message]
            summary: Xóa message (soft delete)
            description: Soft delete message (set deletedAt)
            security:
                - bearerAuth: []
            parameters:
                - name: conversationId
                  in: path
                  required: true
                  schema:
                      type: string
                      format: int64
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [messageId]
                            properties:
                                messageId:
                                    type: string
                                    format: int64
                                    example: "10"
            responses:
                200:
                    description: Xóa message thành công
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        type: string
                                        example: Message đã được xóa
                400:
                    $ref: "#/components/responses/BadRequest"
                401:
                    $ref: "#/components/responses/Unauthorized"
                404:
                    $ref: "#/components/responses/NotFound"
                500:
                    $ref: "#/components/responses/InternalServerError"
