openapi: 3.0.0
info:
    title: Chat Bot API
    version: 1.0.0
    description: Backend API cho hệ thống chat bot

servers:
    - url: http://localhost:3000

components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT

paths:
    /auth/login:
        post:
            tags: [Auth]
            summary: Login user
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [email, password]
                            properties:
                                email:
                                    type: string
                                    example: user@gmail.com
                                password:
                                    type: string
                                    example: 123456
            responses:
                200:
                    description: Login thành công
    /auth/register:
        post:
            tags: [Auth]
            summary: Register user
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [email, password]
                            properties:
                                email:
                                    type: string
                                password:
                                    type: string
            responses:
                201:
                    description: Đăng ký thành công

    /auth/me:
        get:
            tags: [Auth]
            summary: Get current user
            security:
                - bearerAuth: []
            responses:
                200:
                    description: Thông tin user

    /conversation:
        get:
            tags: [Conversation]
            summary: Get all conversations
            security:
                - bearerAuth: []
            responses:
                200:
                    description: Danh sách conversation
    /conversation/{conversationId}:
        get:
            tags: [Conversation]
            summary: Get one conversation
            security:
                - bearerAuth: []
            parameters:
                - name: conversationId
                  in: path
                  required: true
                  schema:
                      type: integer
            responses:
                200:
                    description: Thông tin conversation

        delete:
            tags: [Conversation]
            summary: Delete conversation
            security:
                - bearerAuth: []
            parameters:
                - name: conversationId
                  in: path
                  required: true
                  schema:
                      type: integer
            responses:
                200:
                    description: Xóa thành công

    /conversation/{conversationId}/messages:
        get:
            tags: [Conversation]
            summary: Get messages in conversation
            security:
                - bearerAuth: []
            parameters:
                - name: conversationId
                  in: path
                  required: true
                  schema:
                      type: integer
            responses:
                200:
                    description: Danh sách message

    /conversation/{conversationId}/message:
        post:
            tags: [Conversation]
            summary: Create message
            security:
                - bearerAuth: []
            parameters:
                - name: conversationId
                  in: path
                  required: true
                  schema:
                      type: integer
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                content:
                                    type: string
                                    example: Hello
            responses:
                200:
                    description: Message vừa tạo

        put:
            tags: [Conversation]
            summary: Edit message
            security:
                - bearerAuth: []
            parameters:
                - name: conversationId
                  in: path
                  required: true
                  schema:
                      type: integer
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                content:
                                    type: string
                                    example: Hello edited
            responses:
                200:
                    description: Message đã sửa

        delete:
            tags: [Conversation]
            summary: Delete message
            security:
                - bearerAuth: []
            parameters:
                - name: conversationId
                  in: path
                  required: true
                  schema:
                      type: integer
            responses:
                200:
                    description: Xóa message

    /conversation/stream/{conversationId}:
        get:
            tags: [Conversation]
            summary: Stream message (SSE)
            security:
                - bearerAuth: []
            parameters:
                - name: conversationId
                  in: path
                  required: true
                  schema:
                      type: integer
            responses:
                200:
                    description: Stream dữ liệu
