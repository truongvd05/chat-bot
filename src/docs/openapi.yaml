openapi: 3.0.0
info:
    title: Chat Bot API
    version: 1.0.0
    description: Backend API cho hệ thống zalo clone tương tự zalo
    contact:
        name: thanh090800@gmail.com

servers:
    - url: http://127.0.0.1:3000/api
      description: Local development
    - url: https://your-app.railway.app
      description: Production

components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: JWT access token

    schemas:
        User:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                    example: "1"
                email:
                    type: string
                    format: email
                    example: user@gmail.com
                name:
                    type: string
                    nullable: true
                    example: "Nguyen Van A"
                emailVerifiedAt:
                    type: string
                    format: date-time
                    nullable: true
                activeConversationId:
                    type: string
                    format: int64
                    nullable: true
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time

        Conversation:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                    example: "1"
                title:
                    type: string
                    nullable: true
                    example: "Chat về AI"
                systemPrompt:
                    type: string
                    nullable: true
                    description: System prompt cho bot conversation
                    example: "You are a helpful AI assistant"
                type:
                    type: string
                    enum: [DIRECT, GROUP, BOT]
                    example: DIRECT
                ownerId:
                    type: string
                    format: int64
                    nullable: true
                lastMessageAt:
                    type: string
                    format: date-time
                    nullable: true
                deletedAt:
                    type: string
                    format: date-time
                    nullable: true
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time

        ConversationWithParticipants:
            allOf:
                - $ref: "#/components/schemas/Conversation"
                - type: object
                  properties:
                      participants:
                          type: array
                          items:
                              $ref: "#/components/schemas/ConversationParticipant"
                      unreadCount:
                          type: integer
                          example: 5

        ConversationParticipant:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                    example: "1"
                conversationId:
                    type: string
                    format: int64
                userId:
                    type: string
                    format: int64
                role:
                    type: string
                    enum: [MEMBER, OWNER, ADMIN, BOT]
                    example: MEMBER
                joinedAt:
                    type: string
                    format: date-time
                leftAt:
                    type: string
                    format: date-time
                    nullable: true
                lastReadAt:
                    type: string
                    format: date-time
                    nullable: true
                deletedAt:
                    type: string
                    format: date-time
                    nullable: true
                user:
                    $ref: "#/components/schemas/User"

        Message:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                    example: "1"
                conversationId:
                    type: string
                    format: int64
                parentMessageId:
                    type: string
                    format: int64
                    nullable: true
                userId:
                    type: string
                    format: int64
                    nullable: true
                role:
                    type: string
                    enum: [user, bot]
                    example: user
                content:
                    type: string
                    example: "Xin chào, tôi cần giúp đỡ về AI"
                isEdited:
                    type: boolean
                    default: false
                deletedAt:
                    type: string
                    format: date-time
                    nullable: true
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                user:
                    $ref: "#/components/schemas/User"
                    nullable: true
                attachments:
                    type: array
                    items:
                        $ref: "#/components/schemas/MessageAttachment"

        MessageAttachment:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                messageId:
                    type: string
                    format: int64
                fileName:
                    type: string
                    example: "document.pdf"
                fileUrl:
                    type: string
                    example: "https://storage.example.com/files/abc123.pdf"
                fileType:
                    type: string
                    example: "application/pdf"
                fileSize:
                    type: integer
                    example: 1048576
                createdAt:
                    type: string
                    format: date-time

        FriendRequest:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                    example: "1"
                senderId:
                    type: string
                    format: int64
                receiverId:
                    type: string
                    format: int64
                status:
                    type: string
                    enum: [PENDING, ACCEPTED, REJECTED]
                createdAt:
                    type: string
                    format: date-time
                sender:
                    $ref: "#/components/schemas/User"

        AdminUser:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                email:
                    type: string
                name:
                    type: string
                    nullable: true
                isBanned:
                    type: boolean
                createdAt:
                    type: string
                    format: date-time

        TodayStats:
            type: object
            properties:
                newUsers:
                    type: integer
                    example: 42
                newMessages:
                    type: integer
                    example: 310
                activeUsers:
                    type: integer
                    example: 128
                newGroups:
                    type: integer
                    example: 5

        AuthResponse:
            type: object
            properties:
                accessToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                refreshToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                user:
                    $ref: "#/components/schemas/User"

        Error:
            type: object
            properties:
                error:
                    type: string
                    example: Invalid credentials
                message:
                    type: string
                    example: Email hoặc password không đúng
                statusCode:
                    type: integer
                    example: 401

    responses:
        Unauthorized:
            description: Unauthorized - Token không hợp lệ hoặc hết hạn
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
                    example:
                        error: Unauthorized
                        message: Token không hợp lệ
                        statusCode: 401

        BadRequest:
            description: Bad Request - Dữ liệu đầu vào không hợp lệ
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
                    example:
                        error: Bad Request
                        message: Email không đúng định dạng
                        statusCode: 400

        NotFound:
            description: Not Found - Resource không tồn tại
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
                    example:
                        error: Not Found
                        message: Conversation không tồn tại
                        statusCode: 404

        TooManyRequests:
            description: Too Many Requests - Rate limit exceeded
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
                    example:
                        error: Too Many Requests
                        message: Bạn đã gửi quá nhiều request, vui lòng thử lại sau
                        statusCode: 429

        InternalServerError:
            description: Internal Server Error
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
                    example:
                        error: Internal Server Error
                        message: Đã có lỗi xảy ra, vui lòng thử lại
                        statusCode: 500

        Forbidden:
            description: Forbidden - Không có quyền truy cập
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
                    example:
                        error: Forbidden
                        message: Bạn không có quyền thực hiện hành động này
                        statusCode: 403

paths:
    # ==================== AUTH ====================
    /auth/register:
        post:
            tags: [Auth]
            summary: Đăng ký tài khoản mới
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [email, password]
                            properties:
                                email:
                                    type: string
                                    format: email
                                    example: user@gmail.com
                                password:
                                    type: string
                                    minLength: 6
                                    example: "123456"
                                name:
                                    type: string
                                    example: "Nguyen Van A"
            responses:
                201:
                    description: Đăng ký thành công
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AuthResponse"
                400:
                    $ref: "#/components/responses/BadRequest"
                500:
                    $ref: "#/components/responses/InternalServerError"

    /auth/login:
        post:
            tags: [Auth]
            summary: Đăng nhập
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [email, password]
                            properties:
                                email:
                                    type: string
                                    format: email
                                    example: user@gmail.com
                                password:
                                    type: string
                                    example: "123456"
            responses:
                200:
                    description: Đăng nhập thành công
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AuthResponse"
                400:
                    $ref: "#/components/responses/BadRequest"
                401:
                    description: Sai email hoặc password
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                500:
                    $ref: "#/components/responses/InternalServerError"

    /auth/refresh:
        post:
            tags: [Auth]
            summary: Refresh access token
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [refreshToken]
                            properties:
                                refreshToken:
                                    type: string
                                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            responses:
                200:
                    description: Token mới
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    accessToken:
                                        type: string
                                    refreshToken:
                                        type: string
                401:
                    $ref: "#/components/responses/Unauthorized"
                500:
                    $ref: "#/components/responses/InternalServerError"

    /auth/logout:
        post:
            tags: [Auth]
            summary: Đăng xuất
            security:
                - bearerAuth: []
            responses:
                200:
                    description: Đăng xuất thành công
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        type: string
                                        example: Logout thành công
                401:
                    $ref: "#/components/responses/Unauthorized"
                500:
                    $ref: "#/components/responses/InternalServerError"

    /auth/me:
        get:
            tags: [Auth]
            summary: Lấy thông tin user hiện tại
            security:
                - bearerAuth: []
            responses:
                200:
                    description: Thông tin user
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/User"
                401:
                    $ref: "#/components/responses/Unauthorized"
                500:
                    $ref: "#/components/responses/InternalServerError"

    /auth/forgot-password:
        post:
            tags: [Auth]
            summary: Quên mật khẩu qua email
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [email]
                            properties:
                                email:
                                    type: string
                                    format: email
                                    example: user@gmail.com
            responses:
                200:
                    description: Đã gửi email reset password
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        type: string
                                        example: Email reset password đã được gửi
                400:
                    $ref: "#/components/responses/BadRequest"
                429:
                    $ref: "#/components/responses/TooManyRequests"
                500:
                    $ref: "#/components/responses/InternalServerError"

    /auth/forgot-password-phone:
        post:
            tags: [Auth]
            summary: Quên mật khẩu qua số điện thoại
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [phone]
                            properties:
                                phone:
                                    type: string
                                    example: "0988755951"
            responses:
                200:
                    description: Đã gửi OTP qua SMS
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        type: string
                                        example: OTP đã được gửi qua SMS
                400:
                    $ref: "#/components/responses/BadRequest"
                429:
                    $ref: "#/components/responses/TooManyRequests"
                500:
                    $ref: "#/components/responses/InternalServerError"

    /auth/reset-password:
        post:
            tags: [Auth]
            summary: Đặt lại mật khẩu
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [token, newPassword]
                            properties:
                                token:
                                    type: string
                                    example: "reset-token-abc123"
                                newPassword:
                                    type: string
                                    minLength: 6
                                    example: "newpassword123"
            responses:
                200:
                    description: Đặt lại mật khẩu thành công
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        type: string
                                        example: Mật khẩu đã được đặt lại
                400:
                    $ref: "#/components/responses/BadRequest"
                429:
                    $ref: "#/components/responses/TooManyRequests"
                500:
                    $ref: "#/components/responses/InternalServerError"

    /auth/verify-email:
        post:
            tags: [Auth]
            summary: Xác thực email
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [token]
                            properties:
                                token:
                                    type: string
                                    example: "verify-token-abc123"
            responses:
                200:
                    description: Xác thực email thành công
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        type: string
                                        example: Email đã được xác thực
                400:
                    $ref: "#/components/responses/BadRequest"
                429:
                    $ref: "#/components/responses/TooManyRequests"
                500:
                    $ref: "#/components/responses/InternalServerError"

    /auth/validate/email:
        post:
            tags: [Auth]
            summary: Kiểm tra email có tồn tại không
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [email]
                            properties:
                                email:
                                    type: string
                                    format: email
                                    example: user@gmail.com
            responses:
                200:
                    description: Kết quả kiểm tra email
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    exists:
                                        type: boolean
                400:
                    $ref: "#/components/responses/BadRequest"
                429:
                    $ref: "#/components/responses/TooManyRequests"
                500:
                    $ref: "#/components/responses/InternalServerError"

    /auth/validate/phone:
        post:
            tags: [Auth]
            summary: Kiểm tra số điện thoại có tồn tại không
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [phone]
                            properties:
                                phone:
                                    type: string
                                    example: "0988755951"
            responses:
                200:
                    description: Kết quả kiểm tra số điện thoại
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    exists:
                                        type: boolean
                400:
                    $ref: "#/components/responses/BadRequest"
                429:
                    $ref: "#/components/responses/TooManyRequests"
                500:
                    $ref: "#/components/responses/InternalServerError"

    /auth/change-password:
        post:
            tags: [Auth]
            summary: Đổi mật khẩu
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [oldPassword, newPassword]
                            properties:
                                oldPassword:
                                    type: string
                                    example: "oldpassword123"
                                newPassword:
                                    type: string
                                    minLength: 6
                                    example: "newpassword123"
            responses:
                200:
                    description: Đổi mật khẩu thành công
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        type: string
                                        example: Đổi mật khẩu thành công
                400:
                    $ref: "#/components/responses/BadRequest"
                401:
                    $ref: "#/components/responses/Unauthorized"
                429:
                    $ref: "#/components/responses/TooManyRequests"
                500:
                    $ref: "#/components/responses/InternalServerError"

    /auth/resen-verify-email:
        post:
            tags: [Auth]
            summary: Gửi lại email xác thực
            security:
                - bearerAuth: []
            responses:
                200:
                    description: Đã gửi lại email xác thực
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        type: string
                                        example: Email xác thực đã được gửi lại
                401:
                    $ref: "#/components/responses/Unauthorized"
                429:
                    $ref: "#/components/responses/TooManyRequests"
                500:
                    $ref: "#/components/responses/InternalServerError"

    # ==================== CONVERSATION ====================
    /conversation/direct:
        post:
            tags: [Conversation]
            summary: Tạo cuộc hội thoại trực tiếp (DIRECT)
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [participantId]
                            properties:
                                participantId:
                                    type: string
                                    format: int64
                                    example: "2"
            responses:
                201:
                    description: Tạo conversation thành công
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ConversationWithParticipants"
                400:
                    $ref: "#/components/responses/BadRequest"
                401:
                    $ref: "#/components/responses/Unauthorized"
                429:
                    $ref: "#/components/responses/TooManyRequests"
                500:
                    $ref: "#/components/responses/InternalServerError"

    /conversation/group:
        post:
            tags: [Conversation]
            summary: Tạo nhóm chat (GROUP)
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [title, participantIds]
                            properties:
                                title:
                                    type: string
                                    example: "Nhóm dự án ABC"
                                participantIds:
                                    type: array
                                    items:
                                        type: string
                                        format: int64
                                    example: ["2", "3", "4"]
            responses:
                201:
                    description: Tạo nhóm thành công
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ConversationWithParticipants"
                400:
                    $ref: "#/components/responses/BadRequest"
                401:
                    $ref: "#/components/responses/Unauthorized"
                429:
                    $ref: "#/components/responses/TooManyRequests"
                500:
                    $ref: "#/components/responses/InternalServerError"

    /conversation:
        get:
            tags: [Conversation]
            summary: Lấy tất cả conversations
            security:
                - bearerAuth: []
            parameters:
                - name: page
                  in: query
                  schema:
                      type: integer
                      default: 1
                - name: limit
                  in: query
                  schema:
                      type: integer
                      default: 20
                - name: type
                  in: query
                  schema:
                      type: string
                      enum: [DIRECT, GROUP, BOT]
            responses:
                200:
                    description: Danh sách conversations
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    conversations:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/ConversationWithParticipants"
                                    total:
                                        type: integer
                                        example: 50
                                    page:
                                        type: integer
                                        example: 1
                                    limit:
                                        type: integer
                                        example: 20
                                    totalPages:
                                        type: integer
                                        example: 3
                401:
                    $ref: "#/components/responses/Unauthorized"
                429:
                    $ref: "#/components/responses/TooManyRequests"
                500:
                    $ref: "#/components/responses/InternalServerError"

    /conversation/search:
        get:
            tags: [Conversation]
            summary: Tìm kiếm conversation
            security:
                - bearerAuth: []
            parameters:
                - name: q
                  in: query
                  required: true
                  schema:
                      type: string
                  description: Từ khóa tìm kiếm
                  example: "nhóm dự án"
            responses:
                200:
                    description: Kết quả tìm kiếm
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/ConversationWithParticipants"
                401:
                    $ref: "#/components/responses/Unauthorized"
                500:
                    $ref: "#/components/responses/InternalServerError"

    /conversation/groups:
        get:
            tags: [Conversation]
            summary: Lấy danh sách nhóm chat
            security:
                - bearerAuth: []
            parameters:
                - name: page
                  in: query
                  schema:
                      type: integer
                      default: 1
                - name: limit
                  in: query
                  schema:
                      type: integer
                      default: 20
            responses:
                200:
                    description: Danh sách nhóm chat
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    conversations:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/ConversationWithParticipants"
                                    total:
                                        type: integer
                                    page:
                                        type: integer
                                    limit:
                                        type: integer
                                    totalPages:
                                        type: integer
                401:
                    $ref: "#/components/responses/Unauthorized"
                429:
                    $ref: "#/components/responses/TooManyRequests"
                500:
                    $ref: "#/components/responses/InternalServerError"

    /conversation/{conversationId}:
        get:
            tags: [Conversation]
            summary: Lấy chi tiết conversation
            security:
                - bearerAuth: []
            parameters:
                - name: conversationId
                  in: path
                  required: true
                  schema:
                      type: string
                      format: int64
                  example: "1"
            responses:
                200:
                    description: Thông tin conversation
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ConversationWithParticipants"
                401:
                    $ref: "#/components/responses/Unauthorized"
                404:
                    $ref: "#/components/responses/NotFound"
                429:
                    $ref: "#/components/responses/TooManyRequests"
                500:
                    $ref: "#/components/responses/InternalServerError"

        put:
            tags: [Conversation]
            summary: Đổi tên conversation
            security:
                - bearerAuth: []
            parameters:
                - name: conversationId
                  in: path
                  required: true
                  schema:
                      type: string
                      format: int64
                  example: "1"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                title:
                                    type: string
                                    example: "Tên mới cho conversation"
            responses:
                200:
                    description: Cập nhật thành công
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Conversation"
                400:
